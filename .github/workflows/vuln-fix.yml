name: Vulnerability Auto-Fix

on:
  schedule:
    # Every Monday at 08:00 UTC
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  vuln-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck and capture output
        id: vulncheck
        run: |
          set +e
          OUTPUT=$(govulncheck -show verbose ./... 2>&1)
          EXIT_CODE=$?
          echo "$OUTPUT"
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          # Extract affected module versions for the PR body
          echo "$OUTPUT" > /tmp/vulncheck-output.txt
          exit 0

      - name: Exit if no vulnerabilities
        if: steps.vulncheck.outputs.exit_code == '0'
        run: |
          echo "No vulnerabilities found. Nothing to do."
          exit 0

      - name: Fix module vulnerabilities
        if: steps.vulncheck.outputs.exit_code != '0'
        run: |
          # Upgrade all dependencies to pick up vulnerability fixes
          go get -u ./...
          go mod tidy

      - name: Fix stdlib vulnerabilities (bump Go version)
        if: steps.vulncheck.outputs.exit_code != '0'
        run: |
          # Check if stdlib vulns exist by looking for "Standard library" in output
          if grep -q "Standard library" /tmp/vulncheck-output.txt; then
            # Extract the highest fixed-in Go version from the output
            # Matches lines like "Fixed in: crypto/tls@go1.26.6"
            FIXED_VERSION=$(grep -o 'Fixed in: .*@go[0-9.]*' /tmp/vulncheck-output.txt \
              | sed 's/.*@go//' \
              | sort -V | tail -1)
            if [ -n "$FIXED_VERSION" ]; then
              CURRENT_VERSION=$(awk '/^go / {print $2}' go.mod)
              echo "Current Go version: $CURRENT_VERSION"
              echo "Required Go version: $FIXED_VERSION"
              # Only bump if the fixed version is newer
              if [ "$(printf '%s\n' "$CURRENT_VERSION" "$FIXED_VERSION" | sort -V | tail -1)" = "$FIXED_VERSION" ] && [ "$CURRENT_VERSION" != "$FIXED_VERSION" ]; then
                sed -i "s/^go ${CURRENT_VERSION}/go ${FIXED_VERSION}/" go.mod
                go mod tidy
                echo "Bumped go directive to $FIXED_VERSION"
              fi
            fi
          fi

      - name: Verify fix
        if: steps.vulncheck.outputs.exit_code != '0'
        id: verify
        run: |
          set +e
          govulncheck ./... 2>&1
          VERIFY_EXIT=$?
          echo "verify_exit=$VERIFY_EXIT" >> "$GITHUB_OUTPUT"
          # Continue even if not fully fixed — partial fixes are still valuable
          exit 0

      - name: Check for changes
        if: steps.vulncheck.outputs.exit_code != '0'
        id: changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.vulncheck.outputs.exit_code != '0' && steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: auto/vuln-fix
          delete-branch: true
          title: "fix(deps): patch known vulnerabilities"
          body: |
            ## Automated Vulnerability Fix

            This PR was created by the `vuln-fix` workflow after `govulncheck` detected vulnerabilities.

            ### Changes
            - Upgraded Go module dependencies with known fixes
            - Bumped `go` directive if stdlib patches are available

            ### govulncheck output (before fix)
            <details>
            <summary>Click to expand</summary>

            ```
            ${{ steps.vulncheck.outputs.exit_code != '0' && '(see workflow logs for full output)' || 'No vulnerabilities' }}
            ```
            </details>

            ### Verification
            Post-fix `govulncheck` exited with code `${{ steps.verify.outputs.verify_exit }}` (0 = clean).

            ---
            *Auto-generated by [vuln-fix workflow](../actions/workflows/vuln-fix.yml)*
          commit-message: "fix(deps): patch known vulnerabilities"
          labels: |
            security
            dependencies
            automated
